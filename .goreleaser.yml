version: 2

before:
  hooks:
    - go mod download

builds:
  - id: onkt
    binary: onkt
    main: ./cmd/onkt
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  # The same CLI under its old name, so scripts, the GitHub Action and
  # versions pinned by older onek releases keep working. It prints a notice.
  - id: onek
    binary: onek
    main: ./cmd/onkt
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: onkt-archive
    ids:
      - onkt
      - onek
    name_template: >-
      onekit_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
  # The bare onkt binary per platform, which the onkt npm package downloads
  # on first use; checksums.txt covers it like the archives.
  - id: onkt-binary
    ids:
      - onkt
    formats: [binary]
    name_template: "onkt-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^style:"
      - "^Merge pull request"
      - "^Merge branch"
      - "typo"
      - "minor"
      - "cosmetic"

release:
  github:
    owner: 1homsi
    name: onekit
  name_template: "onekit v{{ .Version }}"
  header: |
    ## onekit {{ .Version }}

    This release includes prebuilt `onkt` CLI binaries for Linux, macOS, and Windows
    (each archive also carries the same binary as `onek`, its former name).
  footer: |
    ## Install with Go

    ```bash
    go install github.com/1homsi/onekit/cmd/onkt@v{{ .Version }}
    ```

    Full changelog: https://github.com/1homsi/onekit/compare/{{ .PreviousTag }}...v{{ .Version }}
  prerelease: auto
  draft: false
  replace_existing_draft: true
  target_commitish: "{{ .Commit }}"
