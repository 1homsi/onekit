name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_TAG:-$REF_NAME}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi
          TAG="v$VERSION"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::Release tag does not exist: $TAG"
            exit 1
          fi
          TAG_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          MAIN_SHA=$(git rev-parse 'refs/remotes/origin/main^{commit}')
          if ! git merge-base --is-ancestor "$TAG_SHA" "$MAIN_SHA"; then
            echo "::error::Release tag $TAG is not an ancestor of origin/main"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: prepare
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install TypeScript compiler
        run: npm install --global --ignore-scripts typescript@7.0.2

      - name: Install dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.3
          args: ""
          only-new-issues: false

      - name: Run Go vet
        run: go vet ./...

      - name: Verify committed generated output
        run: make check-generated

      - name: Verify schema formatting and semantics
        run: make check-schema

      - name: Run tests and coverage
        run: ./scripts/run_tests.sh

      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.17.1
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          artifacts=(dist/checksums.txt dist/*.tar.gz dist/*.zip)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "onekit $RELEASE_TAG" \
              --generate-notes \
              "${artifacts[@]}"
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Sign release checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Upload checksum signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/checksums.txt.sigstore.json --clobber

      - name: Attest release checksums
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/checksums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: dist/

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [prepare, release]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/onek
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.onek
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Sign Docker image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/onek@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Generate Docker SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/onek@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: onek-sbom.spdx.json
          artifact-name: onek-sbom.spdx.json
          upload-release-assets: false

      - name: Attest Docker SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/onek
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: onek-sbom.spdx.json
          push-to-registry: true

      - name: Attest Docker provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/onek
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  announce:
    name: Summarize Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare, release]
    permissions:
      contents: read
    if: ${{ needs.prepare.result == 'success' && needs.release.result == 'success' }}
    steps:
      - name: Write release summary
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "## onekit ${RELEASE_TAG}"
            echo
            echo "The release artifacts are published. Docker image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/onek:${RELEASE_VERSION}"
            echo
            echo "Canonical release page: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
